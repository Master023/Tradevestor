<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Daftar Akun — TradeVestor</title>

<meta
    name="description"
    content="Buat akun TradeVestor untuk mengakses pembelajaran trading."
>

<link
    rel="icon"
    href="logo.jpg"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.auth-page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

}

.auth-box {

    width: 100%;

    max-width: 480px;

}

.auth-card {

    padding: 40px;

}

.auth-logo {

    text-align: center;

    margin-bottom: 30px;

}

.auth-logo img {

    width: 65px;

    height: 65px;

    object-fit: cover;

    border-radius: 15px;

}

.auth-logo h1 {

    margin: 15px 0 5px;

}

.auth-logo p {

    color: var(--muted);

}

.form-group {

    margin-bottom: 18px;

}

.form-group label {

    display: block;

    margin-bottom: 8px;

    font-weight: 600;

}

.form-group input {

    width: 100%;

    box-sizing: border-box;

    padding: 14px 15px;

    border-radius: 10px;

    border: 1px solid rgba(255,255,255,.12);

    background: rgba(255,255,255,.04);

    color: white;

    outline: none;

    font-size: 15px;

}

.form-group input:focus {

    border-color: #8b5cf6;

}

.password-info {

    margin-top: 7px;

    font-size: 12px;

    color: var(--muted);

}

.auth-button {

    width: 100%;

    border: none;

    cursor: pointer;

    margin-top: 8px;

}

.auth-button:disabled {

    opacity: .6;

    cursor: not-allowed;

}

.auth-message {

    display: none;

    margin-top: 18px;

    padding: 14px;

    border-radius: 10px;

    font-size: 14px;

    line-height: 1.5;

}

.auth-message.show {

    display: block;

}

.auth-message.error {

    background: rgba(239,68,68,.12);

    border: 1px solid rgba(239,68,68,.25);

}

.auth-message.success {

    background: rgba(34,197,94,.12);

    border: 1px solid rgba(34,197,94,.25);

}

.auth-footer {

    text-align: center;

    margin-top: 22px;

    color: var(--muted);

}

.auth-footer a {

    color: #a78bfa;

    text-decoration: none;

}

.auth-footer a:hover {

    text-decoration: underline;

}

.back-home {

    display: block;

    text-align: center;

    margin-top: 18px;

    color: var(--muted);

    text-decoration: none;

    font-size: 14px;

}

.back-home:hover {

    color: white;

}

</style>

</head>


<body>


<main class="auth-page">

<div class="auth-box">


<div class="card auth-card">


<!-- =====================================================
     LOGO
===================================================== -->

<div class="auth-logo">

<img
    src="logo.jpg"
    alt="TradeVestor"
>

<h1>
Buat Akun
</h1>

<p>
Bergabung dengan TradeVestor
</p>

</div>



<!-- =====================================================
     REGISTER FORM
===================================================== -->

<form id="registerForm">


<!-- NAMA -->

<div class="form-group">

<label for="name">
Nama
</label>

<input
    type="text"
    id="name"
    name="name"
    placeholder="Masukkan nama lu"
    autocomplete="name"
    required
>

</div>



<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="nama@email.com"
    autocomplete="email"
    required
>

</div>



<!-- PASSWORD -->

<div class="form-group">

<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Minimal 8 karakter"
    autocomplete="new-password"
    minlength="8"
    required
>

<div class="password-info">

Password minimal 8 karakter.

</div>

</div>



<!-- BUTTON -->

<button
    type="submit"
    class="btn btn-primary auth-button"
    id="registerButton"
>

Buat Akun

</button>



<!-- MESSAGE -->

<div
    id="message"
    class="auth-message"
></div>


</form>



<!-- =====================================================
     LOGIN
===================================================== -->

<div class="auth-footer">

Sudah punya akun?

<a href="login.html">
Login di sini
</a>

</div>



<a
    href="index.html"
    class="back-home"
>
← Kembali ke Beranda
</a>


</div>

</div>

</main>



<!-- =====================================================
     JAVASCRIPT REGISTER
===================================================== -->

<script>

const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");



function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "auth-message show " + type;

}



form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;



        // =================================================
        // VALIDATION
        // =================================================

        if (!name) {

            showMessage(
                "Nama wajib diisi.",
                "error"
            );

            return;

        }


        if (!email) {

            showMessage(
                "Email wajib diisi.",
                "error"
            );

            return;

        }


        if (password.length < 8) {

            showMessage(
                "Password minimal 8 karakter.",
                "error"
            );

            return;

        }



        // =================================================
        // LOADING
        // =================================================

        button.disabled = true;

        button.textContent =
            "Membuat akun...";

        message.className =
            "auth-message";



        // =================================================
        // SEND TO CLOUDFLARE WORKER
        // =================================================

        try {

            const response =
                await fetch(
                    "/api/register",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name: name,

                                email: email,

                                password: password

                            })

                    }
                );



            const data =
                await response.json();



            // =================================================
            // ERROR
            // =================================================

            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Pendaftaran gagal.",
                    "error"
                );

                return;

            }



            // =================================================
            // SUCCESS
            // =================================================

            showMessage(
                "Akun berhasil dibuat! Mengarahkan ke login...",
                "success"
            );



            // Bersihkan password

            document
                .getElementById("password")
                .value = "";



            // Redirect ke login

            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1500
            );


        }

        catch (error) {

            console.error(error);

            showMessage(
                "Tidak dapat terhubung ke server. Coba lagi.",
                "error"
            );

        }

        finally {

            button.disabled = false;

            button.textContent =
                "Buat Akun";

        }

    }
);

</script>


</body>

</html>
