<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar — TradeVestor</title>

    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="brand">

            <img
                src="logo.jpg"
                alt="Logo TradeVestor"
            >

            <span>
                TRADE<b>VESTOR</b>
            </span>

        </a>

    </div>

</header>


<main>

<section class="section">

    <div class="container">

        <div
            class="card"
            style="
                max-width:500px;
                margin:60px auto;
            "
        >

            <div class="section-head">

                <span class="kicker">
                    TRADEVESTOR
                </span>

                <h1>
                    Buat Akun
                </h1>

                <p>
                    Bergabung dengan TradeVestor
                </p>

            </div>


            <form id="registerForm">

                <div style="margin-bottom:18px">

                    <label for="name">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Nama lengkap"
                        required
                        style="
                            width:100%;
                            padding:14px;
                            margin-top:8px;
                        "
                    >

                </div>


                <div style="margin-bottom:18px">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nama@email.com"
                        required
                        style="
                            width:100%;
                            padding:14px;
                            margin-top:8px;
                        "
                    >

                </div>


                <div style="margin-bottom:10px">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimal 8 karakter"
                        minlength="8"
                        required
                        style="
                            width:100%;
                            padding:14px;
                            margin-top:8px;
                        "
                    >

                </div>


                <p
                    style="
                        font-size:13px;
                        color:var(--muted);
                        margin-bottom:20px;
                    "
                >
                    Password minimal 8 karakter.
                </p>


                <div
                    id="registerMessage"
                    style="
                        display:none;
                        margin-bottom:20px;
                        padding:14px;
                        border-radius:10px;
                    "
                ></div>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="registerButton"
                    style="
                        width:100%;
                    "
                >
                    Buat Akun
                </button>

            </form>


            <p
                style="
                    text-align:center;
                    margin-top:25px;
                "
            >

                Sudah punya akun?

                <a href="login.html">
                    Login di sini
                </a>

            </p>


            <p
                style="
                    text-align:center;
                    margin-top:15px;
                "
            >

                <a href="index.html">
                    ← Kembali ke Beranda
                </a>

            </p>

        </div>

    </div>

</section>

</main>


<script>

const form =
    document.getElementById("registerForm");

const message =
    document.getElementById("registerMessage");

const button =
    document.getElementById("registerButton");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        if (password.length < 8) {

            showMessage(
                "Password minimal 8 karakter.",
                false
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "Membuat akun...";


        try {

            const response =
                await fetch(
                    "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Registrasi gagal."
                );

            }


            showMessage(
                "Akun berhasil dibuat! Mengarahkan ke login...",
                true
            );


            setTimeout(
                function() {

                    window.location.href =
                        "login.html";

                },
                1200
            );


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Terjadi kesalahan pada server.",
                false
            );


            button.disabled = false;

            button.textContent =
                "Buat Akun";

        }

    }
);


function showMessage(
    text,
    success
) {

    message.style.display =
        "block";

    message.textContent =
        text;


    if (success) {

        message.style.border =
            "1px solid #22c55e";

    } else {

        message.style.border =
            "1px solid #ef4444";

    }

}

</script>

</body>

</html>
