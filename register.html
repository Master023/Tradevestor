<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Daftar — TradeVestor</title>

<meta
    name="description"
    content="Buat akun TradeVestor dan mulai belajar trading."
>

<link
    rel="icon"
    href="logo.jpg"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

/* ==============================
   REGISTER PAGE
============================== */

.register-page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

}


/* ==============================
   CONTAINER
============================== */

.register-container {

    width: 100%;

    max-width: 460px;

}


/* ==============================
   LOGO
============================== */

.register-logo {

    text-align: center;

    margin-bottom: 25px;

}


.register-logo a {

    display: inline-flex;

    align-items: center;

    gap: 10px;

    text-decoration: none;

    color: inherit;

    font-size: 22px;

    font-weight: 700;

}


.register-logo img {

    width: 42px;

    height: 42px;

    object-fit: cover;

    border-radius: 10px;

}


/* ==============================
   CARD
============================== */

.register-card {

    padding: 40px 30px;

    border-radius: 20px;

    background: rgba(255,255,255,0.03);

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.25);

}


/* ==============================
   HEADER
============================== */

.register-header {

    text-align: center;

    margin-bottom: 30px;

}


.register-header h1 {

    margin-bottom: 10px;

    font-size: 32px;

}


.register-header p {

    color: var(--muted);

    margin: 0;

}


/* ==============================
   FORM
============================== */

.form-group {

    margin-bottom: 20px;

}


.form-group label {

    display: block;

    margin-bottom: 8px;

    font-weight: 600;

}


.form-group input {

    width: 100%;

    box-sizing: border-box;

    padding: 14px 15px;

    border-radius: 10px;

    border: 1px solid
        rgba(255,255,255,0.12);

    background:
        rgba(255,255,255,0.04);

    color: inherit;

    outline: none;

    font-size: 15px;

}


.form-group input:focus {

    border-color: #8b5cf6;

}


/* ==============================
   PASSWORD INFO
============================== */

.password-info {

    font-size: 13px;

    color: var(--muted);

    margin-top: 7px;

}


/* ==============================
   BUTTON
============================== */

.register-button {

    width: 100%;

    border: none;

    cursor: pointer;

    margin-top: 5px;

}


.register-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


/* ==============================
   MESSAGE
============================== */

.message {

    display: none;

    padding: 13px 15px;

    border-radius: 10px;

    margin-bottom: 20px;

    font-size: 14px;

    line-height: 1.5;

}


.message.error {

    display: block;

    background:
        rgba(239,68,68,0.12);

    border:
        1px solid rgba(239,68,68,0.3);

    color: #fca5a5;

}


.message.success {

    display: block;

    background:
        rgba(34,197,94,0.12);

    border:
        1px solid rgba(34,197,94,0.3);

    color: #86efac;

}


/* ==============================
   FOOTER
============================== */

.register-footer {

    text-align: center;

    margin-top: 25px;

    color: var(--muted);

}


.register-footer a {

    color: inherit;

    font-weight: 600;

}


.back-home {

    display: block;

    text-align: center;

    margin-top: 20px;

    color: var(--muted);

    text-decoration: none;

    font-size: 14px;

}


/* ==============================
   MOBILE
============================== */

@media (max-width: 500px) {

    .register-card {

        padding: 30px 20px;

    }

    .register-header h1 {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<main class="register-page">


<div class="register-container">


<!-- ==============================
     LOGO
============================== -->

<div class="register-logo">

<a href="index.html">

<img
    src="logo.jpg"
    alt="TradeVestor"
>

<span>
TRADE<b>VESTOR</b>
</span>

</a>

</div>



<!-- ==============================
     CARD
============================== -->

<div class="register-card">


<div class="register-header">

<h1>
Buat Akun
</h1>

<p>
Bergabung dengan TradeVestor
</p>

</div>



<!-- ==============================
     MESSAGE
============================== -->

<div
    id="message"
    class="message"
></div>



<!-- ==============================
     FORM
============================== -->

<form id="registerForm">


<!-- NAME -->

<div class="form-group">

<label for="name">
Nama
</label>

<input
    type="text"
    id="name"
    name="name"
    placeholder="Masukkan nama"
    autocomplete="name"
    required
>

</div>



<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="nama@email.com"
    autocomplete="email"
    required
>

</div>



<!-- PASSWORD -->

<div class="form-group">

<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Minimal 8 karakter"
    autocomplete="new-password"
    minlength="8"
    required
>

<div class="password-info">

Password minimal 8 karakter.

</div>

</div>



<!-- BUTTON -->

<button
    type="submit"
    id="registerButton"
    class="btn btn-primary register-button"
>

Buat Akun

</button>


</form>



<!-- ==============================
     LOGIN
============================== -->

<div class="register-footer">

Sudah punya akun?

<a href="login.html">
Login di sini
</a>

</div>


</div>



<!-- ==============================
     BACK HOME
============================== -->

<a
    href="index.html"
    class="back-home"
>

← Kembali ke Beranda

</a>


</div>

</main>



<script>

/* =====================================================
   TRADEVESTOR REGISTER SYSTEM
===================================================== */


/* ==============================
   API
============================== */

const API_URL =
    "https://tradevestor.startingfromzero95.workers.dev";


/* ==============================
   ELEMENTS
============================== */

const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


/* ==============================
   SHOW MESSAGE
============================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ==============================
   SUBMIT REGISTER
============================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ==========================
           GET DATA
        ========================== */

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        /* ==========================
           VALIDATION
        ========================== */

        if (
            !name ||
            !email ||
            !password
        ) {

            showMessage(
                "Nama, email, dan password wajib diisi.",
                "error"
            );

            return;

        }


        if (password.length < 8) {

            showMessage(
                "Password minimal 8 karakter.",
                "error"
            );

            return;

        }


        /* ==========================
           LOADING
        ========================== */

        button.disabled = true;

        button.textContent =
            "Membuat akun...";

        message.className =
            "message";


        /* ==========================
           REQUEST API
        ========================== */

        try {

            const response =
                await fetch(
                    API_URL + "/api/register",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            /* ==========================
               READ RESPONSE
            ========================== */

            let data;

            try {

                data =
                    await response.json();

            } catch {

                data = {

                    success: false,

                    message:
                        "Response server tidak valid."

                };

            }


            console.log(
                "REGISTER RESPONSE:",
                data
            );


            /* ==========================
               FAILED
            ========================== */

            if (
                !response.ok ||
                data.success !== true
            ) {

                showMessage(
                    data.message ||
                    "Gagal membuat akun.",
                    "error"
                );

                button.disabled =
                    false;

                button.textContent =
                    "Buat Akun";

                return;

            }


            /* ==========================
               SUCCESS
            ========================== */

            showMessage(
                "✓ Akun berhasil dibuat. Mengarahkan ke login...",
                "success"
            );


            button.textContent =
                "Akun Berhasil Dibuat";


            button.disabled =
                true;


            form.reset();


            /* ==========================
               REDIRECT LOGIN
            ========================== */

            setTimeout(
                function() {

                    window.location.href =
                        "login.html?registered=1";

                },
                1200
            );


        }


        /* ==========================
           NETWORK ERROR
        ========================== */

        catch (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );


            showMessage(
                "Tidak dapat terhubung ke server. Silakan coba lagi.",
                "error"
            );


            button.disabled =
                false;


            button.textContent =
                "Buat Akun";

        }

    }
);

</script>


</body>

</html>
