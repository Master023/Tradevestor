<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Daftar — TradeVestor</title>

<link
    rel="icon"
    href="logo.jpg"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.auth-page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

}

.auth-container {

    width: 100%;

    max-width: 440px;

}

.auth-logo {

    display: flex;

    justify-content: center;

    margin-bottom: 25px;

}

.auth-logo img {

    width: 60px;

    height: 60px;

    object-fit: cover;

    border-radius: 16px;

}

.auth-card {

    padding: 32px;

    border-radius: 24px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

}

.auth-card h1 {

    margin-bottom: 8px;

    text-align: center;

}

.auth-subtitle {

    color: var(--muted);

    text-align: center;

    margin-bottom: 28px;

    line-height: 1.6;

}

.form-group {

    margin-bottom: 18px;

}

.form-group label {

    display: block;

    margin-bottom: 8px;

    font-size: .9rem;

    font-weight: 600;

}

.form-group input {

    width: 100%;

    padding: 13px 15px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.04);

    color: white;

    outline: none;

    box-sizing: border-box;

}

.auth-button {

    width: 100%;

    margin-top: 8px;

    cursor: pointer;

}

.auth-button:disabled {

    opacity: .6;

}

.auth-message {

    display: none;

    margin-bottom: 18px;

    padding: 12px 14px;

    border-radius: 12px;

    font-size: .9rem;

}

.auth-message.show {

    display: block;

}

.auth-message.error {

    background:
        rgba(255,70,70,.1);

    border:
        1px solid rgba(255,70,70,.2);

}

.auth-message.success {

    background:
        rgba(70,255,150,.1);

    border:
        1px solid rgba(70,255,150,.2);

}

.auth-footer {

    margin-top: 22px;

    text-align: center;

    color: var(--muted);

    font-size: .9rem;

}

.auth-footer a {

    color: #a99cff;

    text-decoration: none;

}

.back-home {

    display: block;

    margin-top: 18px;

    text-align: center;

    color: var(--muted);

    text-decoration: none;

}

</style>

</head>


<body>


<main class="auth-page">

<div class="auth-container">


<div class="auth-logo">

<img
    src="logo.jpg"
    alt="TradeVestor"
>

</div>


<div class="auth-card">


<h1>
Buat Akun
</h1>


<p class="auth-subtitle">

Bergabung dengan
TradeVestor.

</p>


<div
    id="authMessage"
    class="auth-message"
>
</div>


<form id="registerForm">


<div class="form-group">

<label for="name">
Nama
</label>

<input
    type="text"
    id="name"
    name="name"
    placeholder="Nama lengkap"
    autocomplete="name"
    required
>

</div>


<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="nama@email.com"
    autocomplete="email"
    required
>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Minimal 8 karakter"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>


<div class="form-group">

<label for="passwordConfirm">
Konfirmasi Password
</label>

<input
    type="password"
    id="passwordConfirm"
    name="passwordConfirm"
    placeholder="Ulangi password"
    autocomplete="new-password"
    minlength="8"
    required
>

</div>


<button
    type="submit"
    id="registerButton"
    class="btn btn-primary auth-button"
>

Buat Akun

</button>

</form>


<div class="auth-footer">

Sudah punya akun?

<a href="login.html">
Login
</a>

</div>


</div>


<a
    href="index.html"
    class="back-home"
>
← Kembali ke Beranda
</a>


</div>

</main>


<script src="js/auth.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        redirectIfLoggedIn();


        const form =
            document.getElementById(
                "registerForm"
            );

        const button =
            document.getElementById(
                "registerButton"
            );

        const message =
            document.getElementById(
                "authMessage"
            );


        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent =
                text;

            message.className =
                `auth-message show ${type}`;

        }


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const name =
                    document
                        .getElementById(
                            "name"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "passwordConfirm"
                        )
                        .value;


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "Konfirmasi password tidak sama."
                    );

                    return;

                }


                if (
                    password.length < 8
                ) {

                    showMessage(
                        "Password minimal 8 karakter."
                    );

                    return;

                }


                button.disabled =
                    true;

                button.textContent =
                    "Membuat akun...";


                try {

                    const result =
                        await registerUser(
                            name,
                            email,
                            password
                        );


                    if (
                        !result.ok ||
                        !result.data.success
                    ) {

                        showMessage(
                            result.data.message ||
                            "Registrasi gagal."
                        );

                        return;

                    }


                    showMessage(
                        "Akun berhasil dibuat. Silakan login.",
                        "success"
                    );


                    form.reset();


                    setTimeout(
                        () => {

                            window.location.href =
                                "/login.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    showMessage(
                        "Tidak dapat terhubung ke server."
                    );

                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Buat Akun";

                }

            }
        );

    }
);

</script>


</body>

</html>
