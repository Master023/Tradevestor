<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login — TradeVestor</title>

<meta
    name="description"
    content="Login ke akun TradeVestor."
>

<link
    rel="icon"
    href="logo.jpg"
>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

.auth-page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

}

.auth-container {

    width: 100%;

    max-width: 440px;

}

.auth-logo {

    display: flex;

    justify-content: center;

    margin-bottom: 25px;

}

.auth-logo img {

    width: 60px;

    height: 60px;

    object-fit: cover;

    border-radius: 16px;

}

.auth-card {

    padding: 32px;

    border-radius: 24px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 80px rgba(0,0,0,.35);

}

.auth-card h1 {

    margin-bottom: 8px;

    text-align: center;

}

.auth-subtitle {

    color: var(--muted);

    text-align: center;

    margin-bottom: 28px;

    line-height: 1.6;

}

.form-group {

    margin-bottom: 18px;

}

.form-group label {

    display: block;

    margin-bottom: 8px;

    font-size: .9rem;

    font-weight: 600;

}

.form-group input {

    width: 100%;

    padding: 13px 15px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.04);

    color: white;

    outline: none;

    box-sizing: border-box;

}

.form-group input:focus {

    border-color:
        rgba(120,90,255,.6);

}

.auth-button {

    width: 100%;

    margin-top: 8px;

    cursor: pointer;

}

.auth-button:disabled {

    opacity: .6;

    cursor: not-allowed;

}

.auth-message {

    display: none;

    margin-bottom: 18px;

    padding: 12px 14px;

    border-radius: 12px;

    font-size: .9rem;

    line-height: 1.5;

}

.auth-message.show {

    display: block;

}

.auth-message.error {

    background:
        rgba(255,70,70,.1);

    border:
        1px solid rgba(255,70,70,.2);

}

.auth-message.success {

    background:
        rgba(70,255,150,.1);

    border:
        1px solid rgba(70,255,150,.2);

}

.auth-footer {

    margin-top: 22px;

    text-align: center;

    color: var(--muted);

    font-size: .9rem;

}

.auth-footer a {

    color: #a99cff;

    text-decoration: none;

}

.back-home {

    display: block;

    margin-top: 18px;

    text-align: center;

    color: var(--muted);

    text-decoration: none;

    font-size: .85rem;

}

</style>

</head>


<body>


<main class="auth-page">

<div class="auth-container">


<div class="auth-logo">

<img
    src="logo.jpg"
    alt="TradeVestor"
>

</div>


<div class="auth-card">

<h1>
Selamat Datang Kembali
</h1>


<p class="auth-subtitle">

Login untuk mengakses
dashboard TradeVestor.

</p>


<div
    id="authMessage"
    class="auth-message"
>
</div>


<form id="loginForm">


<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="nama@email.com"
    autocomplete="email"
    required
>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
    required
>

</div>


<button
    type="submit"
    id="loginButton"
    class="btn btn-primary auth-button"
>

Login

</button>

</form>


<div class="auth-footer">

Belum punya akun?

<a href="register.html">
Daftar sekarang
</a>

</div>


</div>


<a
    href="index.html"
    class="back-home"
>
← Kembali ke Beranda
</a>


</div>

</main>


<script src="js/auth.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        redirectIfLoggedIn();

        const form =
            document.getElementById(
                "loginForm"
            );

        const button =
            document.getElementById(
                "loginButton"
            );

        const message =
            document.getElementById(
                "authMessage"
            );


        function showMessage(
            text,
            type = "error"
        ) {

            message.textContent =
                text;

            message.className =
                `auth-message show ${type}`;

        }


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                button.disabled =
                    true;

                button.textContent =
                    "Memproses...";


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById(
                            "password"
                        )
                        .value;


                try {

                    const result =
                        await loginUser(
                            email,
                            password
                        );


                    if (
                        !result.ok ||
                        !result.data.success
                    ) {

                        showMessage(
                            result.data.message ||
                            "Login gagal."
                        );

                        return;

                    }


                    showMessage(
                        "Login berhasil. Mengalihkan...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            redirectAfterLogin();

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                    showMessage(
                        "Tidak dapat terhubung ke server."
                    );

                } finally {

                    button.disabled =
                        false;

                    button.textContent =
                        "Login";

                }

            }
        );

    }
);

</script>


</body>

</html>
