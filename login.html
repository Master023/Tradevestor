<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — TradeVestor</title>

<meta
    name="description"
    content="Login ke akun TradeVestor untuk mengakses materi trading."
>

<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="css/style.css">

<style>

.auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.auth-box {
    width: 100%;
    max-width: 480px;
}

.auth-card {
    padding: 40px;
}

.auth-logo {
    text-align: center;
    margin-bottom: 30px;
}

.auth-logo img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 15px;
}

.auth-logo h1 {
    margin: 15px 0 5px;
}

.auth-logo p {
    color: var(--muted);
    margin: 0;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

.form-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 15px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: white;
    outline: none;
    font-size: 15px;
}

.form-group input:focus {
    border-color: #8b5cf6;
}

.auth-button {
    width: 100%;
    border: none;
    cursor: pointer;
    margin-top: 8px;
}

.auth-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.auth-message {
    display: none;
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
}

.auth-message.show {
    display: block;
}

.auth-message.error {
    background: rgba(239,68,68,.12);
    border: 1px solid rgba(239,68,68,.25);
    color: #fca5a5;
}

.auth-message.success {
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.25);
    color: #86efac;
}

.auth-footer {
    text-align: center;
    margin-top: 22px;
    color: var(--muted);
}

.auth-footer a {
    color: #a78bfa;
    text-decoration: none;
    font-weight: 600;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: var(--muted);
    text-decoration: none;
}

</style>

</head>

<body>

<main class="auth-page">

<div class="auth-box">

<div class="card auth-card">

<div class="auth-logo">

<img
    src="logo.jpg"
    alt="TradeVestor"
>

<h1>
Login
</h1>

<p>
Masuk ke akun TradeVestor
</p>

</div>


<form id="loginForm">

<div class="form-group">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    name="email"
    placeholder="nama@email.com"
    autocomplete="email"
    required
>

</div>


<div class="form-group">

<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    name="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
    required
>

</div>


<button
    type="submit"
    class="btn btn-primary auth-button"
    id="loginButton"
>

Login

</button>


<div
    id="message"
    class="auth-message"
></div>

</form>


<div class="auth-footer">

Belum punya akun?

<a href="register.html">
Daftar di sini
</a>

</div>


<a
    href="index.html"
    class="back-home"
>

← Kembali ke Beranda

</a>

</div>

</div>

</main>


<script>

/* ==========================================
   CONFIG
========================================== */

const API_URL =
    "https://tradevestor.startingfromzero95.workers.dev";


/* ==========================================
   ELEMENT
========================================== */

const form =
    document.getElementById("loginForm");

const button =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "auth-message show " + type;

}


/* ==========================================
   LOGIN
========================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "Email dan password wajib diisi.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Memproses...";

        message.className =
            "auth-message";


        try {

            const response =
                await fetch(
                    API_URL + "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email: email,
                                password: password
                            })
                    }
                );


            const data =
                await response.json();


            console.log(
                "LOGIN RESPONSE:",
                data
            );


            /* ==========================================
               LOGIN GAGAL
            ========================================== */

            if (
                !response.ok ||
                !data.success
            ) {

                showMessage(
                    data.message ||
                    "Email atau password salah.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            /* ==========================================
               SIMPAN DATA USER
            ========================================== */

            if (!data.user) {

                showMessage(
                    "Login berhasil tetapi data user tidak ditemukan.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            localStorage.setItem(
                "tradevestor_user",
                JSON.stringify(data.user)
            );


            localStorage.setItem(
                "tradevestor_logged_in",
                "true"
            );


            /* ==========================================
               LOGIN BERHASIL
            ========================================== */

            showMessage(
                "Login berhasil! Mengarahkan...",
                "success"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "premium-member.html";

                },
                1000
            );

        }

        catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                "Tidak dapat terhubung ke server. Silakan coba lagi.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Login";

        }

    }
);

</script>

</body>

</html>
